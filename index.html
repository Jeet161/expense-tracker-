<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-icon">💸</div>
    <div>
      <h1>Expense Tracker</h1>
      <p>Track your spending, stay in control</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Total Spent</div>
      <div class="stat-value" id="totalSpent">₹0.00</div>
    </div>
    <div class="stat">
      <div class="stat-label">Entries</div>
      <div class="stat-value" id="expenseCount">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Average</div>
      <div class="stat-value" id="avgExpense">₹0.00</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Add Expense</div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="date">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="category">
          <option value="">Select...</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Utilities">Utilities</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="0.00" min="0" step="0.01">
      </div>
    </div>
    <div class="form-group">
      <label>Note (optional)</label>
      <input type="text" id="note" placeholder="What was this for?">
    </div>
    <button class="btn" onclick="addExpense()">+ Add Expense</button>
  </div>

  <div class="card">
    <div class="card-title">History</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Note</th>
            <th style="text-align:right">Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="5" class="empty">No expenses yet — add one above</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
<script>
  let expenses = JSON.parse(localStorage.getItem('expenses_inr')) || [];
  document.getElementById('date').valueAsDate = new Date();

  const fmt = n => '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function addExpense() {
    const date     = document.getElementById('date').value;
    const category = document.getElementById('category').value;
    const amount   = parseFloat(document.getElementById('amount').value);
    const note     = document.getElementById('note').value;
    if (!date || !category || isNaN(amount) || amount <= 0) return alert('Fill in date, category and a valid amount.');
    expenses.push({ id: Date.now(), date, category, amount, note });
    localStorage.setItem('expenses_inr', JSON.stringify(expenses));
    document.getElementById('amount').value = '';
    document.getElementById('note').value   = '';
    document.getElementById('category').value = '';
    document.getElementById('date').valueAsDate = new Date();
    render();
  }

  function deleteExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    localStorage.setItem('expenses_inr', JSON.stringify(expenses));
    render();
  }

  function render() {
    const tbody  = document.getElementById('tbody');
    const sorted = [...expenses].sort((a, b) => new Date(b.date) - new Date(a.date));
    tbody.innerHTML = sorted.length === 0
      ? '<tr><td colspan="5" class="empty">No expenses yet — add one above</td></tr>'
      : sorted.map(e => `
          <tr>
            <td>${new Date(e.date + 'T00:00:00').toLocaleDateString('en-IN')}</td>
            <td><span class="badge cat-${e.category.toLowerCase()}">${e.category}</span></td>
            <td>${e.note || '—'}</td>
            <td class="amount" style="text-align:right">${fmt(e.amount)}</td>
            <td><button class="del" onclick="deleteExpense(${e.id})">×</button></td>
          </tr>`).join('');
    const total = expenses.reduce((s, e) => s + e.amount, 0);
    const count = expenses.length;
    document.getElementById('totalSpent').textContent   = fmt(total);
    document.getElementById('expenseCount').textContent = count;
    document.getElementById('avgExpense').textContent   = fmt(count ? total / count : 0);
  }

  render();
</script>
</body>
</html>

end
